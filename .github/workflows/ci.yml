name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  build_and_test:
    name: Build + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghidra:
          - "12.2"
          - "12.1.4"
          - "12.0.4"
          - "11.4.3"
    steps:
      - uses: actions/checkout@3d3c42e
      - uses: actions/setup-java@d1374f8
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      - name: Install Ghidra ${{ matrix.ghidra }}
        uses: antoniovazquezblanco/setup-ghidra@aeed43f
        with:
          auth_token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ matrix.ghidra }}
      - name: Build
        run: ./gradlew test buildExtension -PGHIDRA_INSTALL_DIR=${{ env.GHIDRA_INSTALL_DIR }}
      - uses: actions/upload-artifact@cf430e0
        with:
          name: Ghidra_DEC_Alpha_Ghidra_${{ matrix.ghidra }}
          path: dist/*_DEC_Alpha.zip
          if-no-files-found: 'error'
  release:
    if: github.ref_type == 'tag'
    name: Upload release artifacts
    runs-on: ubuntu-latest
    needs: build_and_test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: Ghidra_DEC_Alpha_Ghidra_*
      - name: Upload distribution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" Ghidra_DEC_Alpha_Ghidra_*/*_Ghidra_DEC_Alpha.zip
