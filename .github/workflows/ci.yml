name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  build_and_test:
    name: Build + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghidra:
          - "12.2"
          - "12.1.4"
          - "12.0.4"
          - "11.4.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      - name: Install Ghidra ${{ matrix.ghidra }}
        uses: antoniovazquezblanco/setup-ghidra@aeed43f96c28fb96da4b7411455b8748b4931797
        with:
          auth_token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ matrix.ghidra }}
      - name: Build
        env:
	  LANG: en_US.UTF-8
        run: |
	  ./gradlew test buildExtension --project-prop finalRelease=true -PGHIDRA_INSTALL_DIR=${{ env.GHIDRA_INSTALL_DIR }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: DEC_Alpha_Ghidra_${{ matrix.ghidra }}
          path: dist/*_ghidra-alpha.zip
          if-no-files-found: 'error'
  release:
    if: github.ref_type == 'tag'
    name: Upload release artifacts
    runs-on: ubuntu-latest
    needs: build_and_test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: DEC_Alpha_Ghidra_*
      - name: Upload distribution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" DEC_Alpha_Ghidra_*.zip
